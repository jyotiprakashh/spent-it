<!-- @dsCard group="Components" viewport="700x260" name="Data & feedback" subtitle="AccountCard, ProgressBar, EmptyState, Fab" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  #root { padding: var(--space-four); display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-four); align-items: center; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; color: var(--text-secondary); margin-bottom: var(--space-two); }
  .budget { display: flex; flex-direction: column; gap: var(--space-two); }
  .brow { display: flex; justify-content: space-between; font-size: var(--text-footnote); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { AccountCard, ProgressBar, EmptyState, Fab, Money } = window.SpentItDesignSystem_767bfa;
    function Budget({label, spent, max}) {
      return (
        <div className="budget">
          <div className="brow"><span style={{fontWeight:600}}>{label}</span><Money value={spent} size={13} tone="muted" /></div>
          <ProgressBar value={spent} max={max} />
        </div>
      );
    }
    function Demo() {
      return (
        <React.Fragment>
          <div><div className="lbl">Account</div>
            <div style={{display:'flex',gap:8}}>
              <AccountCard account={null} totalNetWorth={84320} selected />
              <AccountCard account={{name:'Cash',balance:5400,icon:'wallet',color:'#00d09c'}} />
            </div>
          </div>
          <div><div className="lbl">Budgets</div>
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <Budget label="Groceries" spent={3200} max={6000} />
              <Budget label="Dining" spent={4700} max={5000} />
              <Budget label="Shopping" spent={5200} max={4000} />
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
            <EmptyState icon="receipt" title="No transactions" subtitle="Tap + to add your first" style={{padding:0}} />
            <Fab aria-label="Add" />
          </div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
