<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  #root { padding: var(--space-four); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-four); align-items: start; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; color: var(--text-secondary); margin-bottom: var(--space-two); }
  .group { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .div { height: 1px; background: var(--border-subtle); margin-left: 64px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { ListRow, SwitchRow, TransactionRow, Card } = window.SpentItDesignSystem_767bfa;
    function Demo() {
      const [bio, setBio] = React.useState(true);
      return (
        <React.Fragment>
          <div>
            <div className="lbl">List & switch rows</div>
            <div className="group">
              <ListRow leadingIcon="currency" title="Currency" trailingText="INR" onClick={()=>{}} />
              <div className="div" />
              <ListRow leadingIcon="theme" title="Theme" trailingText="Light" onClick={()=>{}} />
              <div className="div" />
              <SwitchRow leadingIcon="biometric" title="Biometric lock" subtitle="Require Face ID to open" checked={bio} onChange={setBio} />
            </div>
          </div>
          <div>
            <div className="lbl">Transaction rows</div>
            <Card padded={false}>
              <TransactionRow tx={{category:'Groceries',icon:'groceries',color:'#00d09c',note:'BigBasket',amount:1240,type:'expense'}} onClick={()=>{}} />
              <TransactionRow tx={{category:'Salary',icon:'salary',color:'#00d09c',note:'June',amount:62000,type:'income'}} onClick={()=>{}} />
              <TransactionRow tx={{category:'Transport',icon:'transport',color:'#f5a623',account:'Cash',amount:80,type:'expense'}} onClick={()=>{}} />
            </Card>
          </div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
