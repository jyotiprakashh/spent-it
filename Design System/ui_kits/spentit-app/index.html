<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpentIt — App</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-display);
    background:
      radial-gradient(1200px 600px at 50% -10%, #eafaf4 0%, transparent 60%),
      #e7eaef;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .phone {
    position: relative;
    width: 390px; height: 844px;
    background: #0a0a0a;
    border-radius: 56px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), 0 30px 70px -20px rgba(0,0,0,0.45), inset 0 0 2px 2px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    background: var(--surface-page);
    border-radius: 44px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* dynamic island */
  .phone-screen::before {
    content: ''; position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 32px; background: #000; border-radius: 18px; z-index: 100;
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: var(--text-primary); opacity: 0.28; z-index: 70;
  }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; -ms-overflow-style: none; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  button { font-family: var(--font-display); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="widgets.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Transactions.jsx"></script>
  <script type="text/babel" src="AddTransaction.jsx"></script>
  <script type="text/babel" src="Analytics.jsx"></script>
  <script type="text/babel" src="Settings.jsx"></script>
  <script type="text/babel" src="Onboarding.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script type="text/babel" data-presets="react">
    const mount = () => {
      if (!window.App) { return setTimeout(mount, 30); }
      ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
    };
    mount();
  </script>
</body>
</html>
