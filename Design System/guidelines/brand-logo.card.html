<!-- @dsCard group="Brand" viewport="700x200" name="Logo & app icon" subtitle="The wallet mark on green; lockup" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-four); display: flex; gap: var(--space-five); align-items: center; }
  .tile { display:flex; flex-direction:column; gap:var(--space-two); align-items:center; }
  .tile span { font-size: var(--text-caption); color: var(--text-secondary); }
  .icon { width: 96px; height: 96px; border-radius: 22px; }
  .lock { display:flex; align-items:center; gap:var(--space-three); }
  .lock .mark { width:56px; height:56px; }
  .lock .word { font-size: 38px; font-weight: var(--weight-heavy); letter-spacing: -1.2px; }
  .lock .word b { color: var(--green-500); }
  .onbrand { background: var(--green-500); padding: var(--space-three) var(--space-four); border-radius: var(--radius-lg); }
  .onbrand .word { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tile"><img class="icon" src="../assets/icon.png" alt="SpentIt app icon" /><span>App icon</span></div>
    <div class="tile"><div class="lock"><img class="mark" src="../assets/logo.png" alt="SpentIt mark" /><span class="word">Spent<b>It</b></span></div><span>Primary lockup</span></div>
  </div>
</body>
</html>
