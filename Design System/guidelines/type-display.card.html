<!-- @dsCard group="Type" viewport="700x180" name="Spline Sans" subtitle="The product's single typeface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-four) var(--space-three); }
  .big { font-size: 56px; font-weight: var(--weight-heavy); letter-spacing: -1px; line-height: 1; }
  .row { display: flex; gap: var(--space-four); margin-top: var(--space-three); align-items: baseline; }
  .w { display: flex; flex-direction: column; gap: 2px; }
  .w b { font-size: var(--text-title); }
  .w span { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="big">Spent it.</div>
    <div class="row">
      <div class="w"><b style="font-weight:400">Aa 123</b><span>Regular 400</span></div>
      <div class="w"><b style="font-weight:500">Aa 123</b><span>Medium 500</span></div>
      <div class="w"><b style="font-weight:600">Aa 123</b><span>Semibold 600</span></div>
      <div class="w"><b style="font-weight:700">Aa 123</b><span>Bold 700</span></div>
    </div>
  </div>
</body>
</html>
