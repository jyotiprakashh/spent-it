<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme" subtitle="The same tokens on a #0C0C0C canvas" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-two); padding: var(--space-three); }
  .sw { display: flex; flex-direction: column; gap: var(--space-two); }
  .chip { height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .name { font-size: var(--text-caption); font-weight: var(--weight-semibold); }
  .hex { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--green-500)"></div><span class="name">Primary</span><span class="hex">00D09C</span></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="name">Text</span><span class="hex">EFEFEF</span></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><span class="name">Secondary</span><span class="hex">8A8A8A</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><span class="name">Card</span><span class="hex">181818</span></div>
    <div class="sw"><div class="chip" style="background:var(--green-selected)"></div><span class="name">Selected</span><span class="hex">0D2A22</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-0)"></div><span class="name">Page</span><span class="hex">0C0C0C</span></div>
  </div>
</body>
</html>
