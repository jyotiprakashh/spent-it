<!-- @dsCard group="Type" viewport="700x160" name="Money" subtitle="Numerals: -0.2 tracking, color-coded by direction" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-four) var(--space-three); display: flex; gap: var(--space-five); align-items: center; }
  .m { letter-spacing: var(--tracking-money); font-weight: var(--weight-bold); }
  .c { display: flex; flex-direction: column; gap: 2px; }
  .c span { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="c"><div class="m" style="font-size:30px">₹84,320</div><span>Net worth</span></div>
    <div class="c"><div class="m" style="font-size:17px; color:var(--income)">+ ₹12,400</div><span>Income</span></div>
    <div class="c"><div class="m" style="font-size:17px; color:var(--expense)">− ₹8,150</div><span>Expense</span></div>
    <div class="c"><div class="m" style="font-size:15px; color:var(--text-secondary)">₹540</div><span>Muted</span></div>
  </div>
</body>
</html>
