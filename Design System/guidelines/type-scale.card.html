<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-three); display: flex; flex-direction: column; gap: var(--space-two); }
  .r { display: flex; align-items: baseline; gap: var(--space-three); }
  .r .t { flex: 1; }
  .r .m { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="r"><div class="t" style="font-size:var(--text-amount); font-weight:700; letter-spacing:-0.2px">₹84,320</div><div class="m">amount · 30 / 700</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-display); font-weight:800">Settings</div><div class="m">display · 28 / 800</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-title); font-weight:600">Add expense</div><div class="m">title · 22 / 600</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-callout); font-weight:600">No recent activity</div><div class="m">callout · 17 / 600</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-body); font-weight:600">Groceries</div><div class="m">body · 15 / 600</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-footnote)">Cash · 4 Jun</div><div class="m">footnote · 13</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-caption); color:var(--text-secondary)">Income</div><div class="m">caption · 12</div></div>
    <div class="r"><div class="t" style="font-size:var(--text-overline); font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-secondary)">This Month</div><div class="m">overline · 11 / 700</div></div>
  </div>
</body>
</html>
