<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-three); display: flex; flex-direction: column; gap: var(--space-three); }
  .row { display: flex; gap: var(--space-two); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: var(--space-one); flex: 1; }
  .circle { width: var(--icon-tint-md); height: var(--icon-tint-md); border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; }
  .g { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile span { font-size: 11px; color: var(--text-secondary); }
  .note { font-size: var(--text-caption); color: var(--text-secondary); line-height: 1.45; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="tile"><div class="circle" style="background:#00d09c22"><svg class="g" viewBox="0 0 24 24" style="color:#00d09c"><circle cx="8" cy="21" r="1"></circle> <circle cx="19" cy="21" r="1"></circle> <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg></div><span>Groceries</span></div>
      <div class="tile"><div class="circle" style="background:#f45b6922"><svg class="g" viewBox="0 0 24 24" style="color:#f45b69"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path> <path d="M7 2v20"></path> <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg></div><span>Food</span></div>
      <div class="tile"><div class="circle" style="background:#f5a62322"><svg class="g" viewBox="0 0 24 24" style="color:#f5a623"><path d="M8 6v6"></path> <path d="M15 6v6"></path> <path d="M2 12h19.6"></path> <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"></path> <circle cx="7" cy="18" r="2"></circle> <path d="M9 18h5"></path> <circle cx="16" cy="18" r="2"></circle></svg></div><span>Transport</span></div>
      <div class="tile"><div class="circle" style="background:#6c63ff22"><svg class="g" viewBox="0 0 24 24" style="color:#6c63ff"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div><span>Rent</span></div>
      <div class="tile"><div class="circle" style="background:#00d09c22"><svg class="g" viewBox="0 0 24 24" style="color:#00d09c"><rect width="20" height="12" x="2" y="6" rx="2"></rect> <circle cx="12" cy="12" r="2"></circle> <path d="M6 12h.01M18 12h.01"></path></svg></div><span>Salary</span></div>
      <div class="tile"><div class="circle" style="background:#ec407a22"><svg class="g" viewBox="0 0 24 24" style="color:#ec407a"><path d="M12 7v14"></path> <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"></path> <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"></path> <rect x="3" y="7" width="18" height="4" rx="1"></rect></svg></div><span>Gifts</span></div>
      <div class="tile"><div class="circle" style="background:#26a69a22"><svg class="g" viewBox="0 0 24 24" style="color:#26a69a"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path> <path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg></div><span>Health</span></div>
      <div class="tile"><div class="circle" style="background:var(--ink-600)"><svg class="g" viewBox="0 0 24 24" style="color:#fff"><path d="M5 12h14"></path> <path d="M12 5v14"></path></svg></div><span>FAB</span></div>
      <div class="tile"><div class="circle" style="background:#7e57c222"><svg class="g" viewBox="0 0 24 24" style="color:#7e57c2"><rect width="18" height="18" x="3" y="3" rx="2"></rect> <path d="M7 3v18"></path> <path d="M3 7.5h4"></path> <path d="M3 12h18"></path> <path d="M3 16.5h4"></path> <path d="M17 3v18"></path> <path d="M17 7.5h4"></path> <path d="M17 16.5h4"></path></svg></div><span>Movies</span></div>
      <div class="tile"><div class="circle" style="background:#5c6bc022"><svg class="g" viewBox="0 0 24 24" style="color:#5c6bc0"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect> <path d="M12 18h.01"></path></svg></div><span>Phone</span></div>
    </div>
    <p class="note">One outline weight throughout (stroke 2, round caps). Category glyphs sit in a circle tinted to 13% of the category color. Solid marks appear only inside the green FAB and on selected states. No emoji in product UI.</p>
  </div>
</body>
</html>
