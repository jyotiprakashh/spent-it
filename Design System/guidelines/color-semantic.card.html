<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Income, expense, warning — used sparingly" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { display: flex; gap: var(--space-three); padding: var(--space-three); }
  .sw { flex: 1; display: flex; flex-direction: column; gap: var(--space-two); }
  .chip { height: 56px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-weight: var(--weight-semibold); font-size: var(--text-body); }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .name { font-size: var(--text-footnote); font-weight: var(--weight-semibold); }
  .hex { font-size: var(--text-caption); color: var(--text-secondary); font-family: var(--font-mono); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--green-subtle); color:var(--income)">+ ₹1,200</div><div class="meta"><span class="name">Income</span><span class="hex">#00D09C</span></div></div>
    <div class="sw"><div class="chip" style="background:#fdeaec; color:var(--expense)">− ₹860</div><div class="meta"><span class="name">Expense</span><span class="hex">#F45B69</span></div></div>
    <div class="sw"><div class="chip" style="background:#fdf3e3; color:var(--warning)">80%</div><div class="meta"><span class="name">Warning</span><span class="hex">#F5A623</span></div></div>
    <div class="sw"><div class="chip" style="background:#fdeaec; color:var(--error)">!</div><div class="meta"><span class="name">Error</span><span class="hex">#F45B69</span></div></div>
  </div>
</body>
</html>
