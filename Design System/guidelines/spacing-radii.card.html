<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="Soft corners; one shadow (the FAB)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: var(--space-three); display: flex; gap: var(--space-four); align-items: center; }
  .b { display: flex; flex-direction: column; align-items: center; gap: var(--space-two); }
  .sq { width: 64px; height: 64px; background: var(--surface-card); border: 1px solid var(--border-subtle); }
  .b .n { font-size: var(--text-caption); font-weight: var(--weight-semibold); }
  .b .v { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
  .fab { width:56px; height:56px; border-radius:var(--radius-pill); background:var(--green-500); box-shadow: var(--shadow-fab); display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; border:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">10</span></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">12</span></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div><span class="n">lg · card</span><span class="v">14</span></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div><span class="n">xl · sheet</span><span class="v">20</span></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span><span class="v">999</span></div>
    <div class="b" style="margin-left:auto"><div class="fab">+</div><span class="n">FAB shadow</span><span class="v">0 4 8 / 15%</span></div>
  </div>
</body>
</html>
